[project]
name = "api"
version = "0.1.0"
description = "Backend FastAPI con autenticación JWT"
readme = "README.md"
authors = [
    { name = "sabw14", email = "56178407+sabw14@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "libpass[bcrypt]>=1.9.4",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "tinydb>=4.9.0",
]

[project.scripts]
create-admin = "api.create_admin:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
